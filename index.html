<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07030f">
  <meta name="description" content="ASS — Atmospheric Severity System.">
  <title>ASS</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      color-scheme: dark;
      --cyan:#67e8f9;
      --pink:#ec4899;
      --green:#84f542;
      --yellow:#fde68a;
      --panel:rgba(10,6,32,.78);
      --border:rgba(103,232,249,.28);
    }
    *{box-sizing:border-box}
    html{min-height:100%;background:#050312}
    body{
      margin:0;min-height:100vh;padding:18px;color:#fdf4ff;
      background:
        radial-gradient(circle at 50% 5%,rgba(132,245,66,.12),transparent 23%),
        radial-gradient(circle at 50% 8%,rgba(255,68,202,.20),transparent 36%),
        linear-gradient(180deg,#17062c 0%,#0a0620 48%,#050312 100%);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button{font:inherit}
    button:focus-visible{outline:3px solid white;outline-offset:3px}

    .app{
      position:relative;isolation:isolate;width:min(980px,100%);margin:0 auto;overflow:hidden;
      border:1px solid rgba(132,245,66,.5);border-radius:28px;padding:22px;
      background:
        radial-gradient(circle at 50% 8%,rgba(132,245,66,.10),transparent 22%),
        radial-gradient(circle at 50% 8%,rgba(255,68,202,.20),transparent 34%),
        linear-gradient(180deg,#17062c 0%,#0a0620 48%,#050312 100%);
      box-shadow:inset 0 0 0 1px rgba(103,232,249,.16),0 0 30px rgba(132,245,66,.12);
    }
    .scanlines{
      position:absolute;inset:0;z-index:20;pointer-events:none;opacity:.42;
      background:repeating-linear-gradient(180deg,rgba(255,255,255,.10) 0,rgba(255,255,255,.10) 1px,rgba(0,0,0,.24) 2px,rgba(0,0,0,.24) 4px);
      mix-blend-mode:soft-light;
    }
    .scan-sweep{
      position:absolute;left:0;right:0;top:-18%;height:18%;z-index:19;pointer-events:none;
      background:linear-gradient(180deg,transparent,rgba(132,245,66,.10),rgba(103,232,249,.22),transparent);
      animation:scanSweep 3.6s linear infinite;
    }
    @keyframes scanSweep{from{transform:translateY(0)}to{transform:translateY(650%)}}
    .crt-vignette{
      position:absolute;inset:0;z-index:18;pointer-events:none;
      box-shadow:inset 0 0 45px rgba(0,0,0,.35),inset 0 0 110px rgba(0,0,0,.42),inset 0 0 22px rgba(34,211,238,.08);
    }
    .content{position:relative;z-index:1}
    header{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:28px;text-align:left}
    .app-tile{
      width:88px;height:88px;flex:0 0 auto;overflow:hidden;border:2px solid var(--green);border-radius:18px;background:#07030f;
      box-shadow:0 0 12px var(--green),0 0 28px rgba(132,245,66,.38);
    }
    .app-tile img{display:block;width:100%;height:100%;image-rendering:pixelated}
    .kicker,.panel-label{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;letter-spacing:.22em;color:var(--cyan)
    }
    .title{
      margin:.25rem 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(2.5rem,8vw,5rem);font-weight:900;
      line-height:.95;letter-spacing:.12em;color:#fff;text-shadow:3px 3px 0 var(--green),-3px -3px 0 #7e22ce,0 0 22px rgba(132,245,66,.68)
    }
    .music,.transmit{
      border:1px solid var(--cyan);border-radius:10px;padding:.8rem 1rem;color:#fff;background:linear-gradient(135deg,#3f1d74,#9d174d);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75rem;font-weight:900;letter-spacing:.07em;cursor:pointer;
      box-shadow:0 0 14px rgba(219,39,119,.35);transition:.12s ease
    }
    .music:hover,.transmit:hover{transform:translateY(-1px);filter:brightness(1.15)}
    .music[aria-pressed="true"]{border-color:var(--green);background:linear-gradient(135deg,#14532d,#3f6212);box-shadow:0 0 16px rgba(132,245,66,.5)}

    .meters{display:grid;gap:18px}
    .meter-row{display:grid;grid-template-columns:minmax(120px,180px) 1fr 42px;gap:.9rem;align-items:center}
    .meter-name{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.86rem;font-weight:800;letter-spacing:.08em;color:#f5d0fe
    }
    .meter-help{margin-top:.2rem;font-size:.74rem;line-height:1.3;color:#a5b4fc}
    .meter-track{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
    .pixel-block{
      min-width:0;height:42px;border:1px solid rgba(129,140,248,.35);border-radius:5px;background:rgba(16,12,43,.9);
      box-shadow:inset 0 0 12px rgba(76,29,149,.22);cursor:pointer
    }
    .pixel-block.active{
      border-color:transparent;background:var(--meter-gradient);
      box-shadow:0 0 8px var(--meter-glow),0 0 16px var(--meter-glow),inset 0 0 12px rgba(255,255,255,.18)
    }
    .pixel-block.selected{
      outline:2px solid #fff;outline-offset:2px;animation:selectedPulse .72s ease-in-out infinite
    }
    @keyframes selectedPulse{
      0%,100%{
        transform:scale(1);filter:brightness(1);
        box-shadow:0 0 8px var(--meter-glow),0 0 16px var(--meter-glow),inset 0 0 12px rgba(255,255,255,.18)
      }
      50%{
        transform:scale(1.055);filter:brightness(1.38) saturate(1.17);
        box-shadow:0 0 11px var(--meter-glow),0 0 25px var(--meter-glow),inset 0 0 15px rgba(255,255,255,.31)
      }
    }
    .meter-value{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.25rem;font-weight:900;color:var(--green);
      text-align:center;text-shadow:0 0 10px rgba(132,245,66,.75)
    }

    .score-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}
    .panel,.verdict,.share{
      border:1px solid var(--border);background:var(--panel);
      box-shadow:inset 0 0 18px rgba(76,29,149,.18),0 0 18px rgba(132,245,66,.07)
    }
    .panel{border-radius:14px;padding:1rem;text-align:center}
    .score-code{
      display:flex;justify-content:center;gap:.2em;margin-top:.4rem;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(1.8rem,7vw,3rem);font-weight:900;color:#fff;
      text-shadow:0 0 12px rgba(34,211,238,.65)
    }
    .score-code span{display:inline-block;min-width:.65em}
    .score-code span.roll{animation:digitRoll .18s ease}
    @keyframes digitRoll{0%{transform:translateY(-35%);opacity:0}100%{transform:translateY(0);opacity:1}}
    .classification{margin-top:.45rem;color:#d9ff57;font-weight:800}
    .verdict{margin-top:12px;border-radius:18px;padding:1.25rem;text-align:center}
    .verdict-name{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.12rem;font-weight:900;color:var(--yellow);
      text-shadow:0 0 12px rgba(250,204,21,.5)
    }
    .verdict-copy{margin:.55rem 0 0;color:#e9d5ff}
    .summary{margin:.8rem 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;color:var(--cyan)}
    .share{display:flex;justify-content:center;margin-top:12px;border-radius:18px;padding:16px}
    .transmit{min-width:min(100%,320px);padding:1rem 1.25rem;font-size:.82rem}
    .transmit.transmitted{
      border-color:var(--green);color:#07110a;background:linear-gradient(135deg,#d9ff57,#84f542);
      box-shadow:0 0 10px rgba(132,245,66,.95),0 0 28px rgba(132,245,66,.75),inset 0 0 10px rgba(255,255,255,.65);
      animation:transmitFlash .18s ease-in-out 2 alternate
    }
    @keyframes transmitFlash{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.025);filter:brightness(1.35)}}

    @media(max-width:760px){
      body{padding:10px}.app{padding:17px;border-radius:22px}header{flex-direction:column;text-align:center}
      .meter-row{grid-template-columns:1fr 38px}.meter-label{grid-column:1/-1}.meter-help{display:none}.score-grid{grid-template-columns:1fr}
    }
    @media(max-width:500px){.meter-track{gap:3px}.pixel-block{height:36px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <div class="scanlines" aria-hidden="true"></div>
    <div class="scan-sweep" aria-hidden="true"></div>
    <div class="crt-vignette" aria-hidden="true"></div>

    <div class="content">
      <header>
        <div class="app-tile"><img src="icon.svg" alt="Green pixel-art skull and crossbones"></div>
        <div>
          <div class="kicker">ATMOSPHERIC SEVERITY SYSTEM</div>
          <h1 class="title">ASS</h1>
        </div>
        <button id="music-toggle" class="music" type="button" aria-pressed="false">▶ START MUSIC</button>
      </header>

      <section id="meters" class="meters" aria-label="ASS score controls"></section>

      <section class="score-grid">
        <div class="panel">
          <div class="panel-label">ASS CODE</div>
          <div id="code" class="score-code" aria-live="polite"><span>0</span><span>0</span><span>0</span></div>
        </div>
        <div class="panel">
          <div class="panel-label">FINAL CLASSIFICATION</div>
          <div id="classification" class="classification">😇 Administrative Error</div>
        </div>
      </section>

      <section class="verdict" aria-live="polite">
        <div id="verdict-name" class="verdict-name">😇 Administrative Error</div>
        <p id="description" class="verdict-copy">No measurable incident. The atmosphere has nothing useful to report.</p>
        <p id="summary" class="summary">A 0 · S 0 · S 0</p>
      </section>

      <section class="share">
        <button id="transmit" class="transmit" type="button">TRANSMIT SCORE</button>
      </section>
    </div>
  </main>

  <script>
    "use strict";

    const items = [
      ["A","Amount","How much payload entered the atmosphere?"],
      ["S","Smell","How aggressively did the air file a complaint?"],
      ["S","Sound","How loudly did the event announce itself?"]
    ];

    const amountBands = [
      ["Trace","a trace sized release"],
      ["Tiny","a tiny release"],
      ["Small","a small but definite release"],
      ["Moderate","a moderate atmospheric payload"],
      ["Heavy","a heavy release"],
      ["Massive","a massive atmospheric payload"],
      ["Severe","a severe volume event"],
      ["Extreme","an extreme volume event"],
      ["Catastrophic","a room dominating payload"],
      ["Apocalyptic","a maximum-output atmospheric event"]
    ];

    const smellBands = [
      ["Clean","with essentially no odor"],
      ["Faint","with only a faint smell"],
      ["Noticeable","with a clearly noticeable smell"],
      ["Funky","with an increasingly questionable odor"],
      ["Rank","with a rank odor"],
      ["Noxious","with a noxious smell"],
      ["Toxic","with an aggressively toxic stink"],
      ["Biohazard","with a biohazard grade odor"],
      ["Plague","with a room clearing plague cloud"],
      ["Extinction","with an extinction tier stench"]
    ];

    const soundBands = [
      ["Silent","and virtually no sound"],
      ["Whisper","and only a whisper of noise"],
      ["Murmur","and an audible little murmur"],
      ["Rattle","and a suspicious rattle"],
      ["Blatant","and an unmistakable report"],
      ["Thunder","and a thunderous announcement"],
      ["Detonation","and a concussive blast"],
      ["Air Raid","and an alarmingly violent report"],
      ["Siege","and a room commanding sonic event"],
      ["Doom","and a maximum volume apocalypse"]
    ];

    const severityRanks = [
      "Harmless","Trivial","Mild","Notable","Questionable",
      "Hazardous","Severe","Critical","Catastrophic","Apocalyptic"
    ];

    const palettes = [
      ["#22d3ee","#2563eb","#8b5cf6","rgba(34,211,238,.9)"],
      ["#84f542","#22c55e","#0891b2","rgba(132,245,66,.95)"],
      ["#f0abfc","#c026d3","#4f46e5","rgba(240,171,252,.9)"]
    ];

    const values = [0,0,0];
    const meters = document.getElementById("meters");

    let audioContext = null;
    let musicTimer = null;
    let nextNoteTime = 0;
    let musicStep = 0;

    const headlineAmount = ["barely there","tiny","little","small","modest","decent","big","huge","massive","enormous"];
    const headlineSmell = ["innocent","faint","suspicious","funky","stinky","rank","nasty","toxic","nightmarish","unforgivable"];
    const headlineSound = ["silent","hushed","quiet","audible","obvious","loud","booming","thunderous","deafening","apocalyptic"];
    const headlineNouns = ["nothing","whisper","incident","mistake","problem","event","offense","disaster","atrocity","apocalypse"];

    function classificationFor(a, smell, sound) {
      const code = `${a}${smell}${sound}`;

      if (a === 0 && smell === 0 && sound === 0) {
        return {
          emoji: "😇",
          name: "Nothing happened",
          description: "Score 000. Against all odds, the air remains innocent."
        };
      }

      const weighted = a * 1.15 + smell * 1.25 + sound;
      const peak = Math.max(a, smell, sound);
      const severity = Math.min(9, Math.floor((weighted / 30.6) * 8 + peak / 9));

      let emoji = "💨";
      if (severity >= 8) emoji = "💀";
      else if (severity >= 7) emoji = "☣️";
      else if (severity >= 6) emoji = "🤢";
      else if (severity >= 5) emoji = "😵";
      else if (severity >= 3) emoji = "😏";
      else if (severity <= 1) emoji = "🤏";

      const amountPhrase = [
        "almost no gas",
        "a tiny puff",
        "a little puff",
        "a small cloud",
        "a modest cloud",
        "a decent cloud",
        "a big cloud",
        "a huge cloud",
        "a massive cloud",
        "an enormous cloud"
      ];

      const smellPhrase = [
        "no smell at all",
        "almost no smell",
        "a faint whiff",
        "a noticeable funk",
        "a proper stink",
        "a serious reek",
        "a nasty stench",
        "a hazardous odor",
        "a nightmare smell",
        "an unforgivable stench"
      ];

      const soundPhrase = [
        "total silence",
        "barely a sound",
        "a quiet little noise",
        "an audible report",
        "an obvious announcement",
        "a loud report",
        "a booming report",
        "a thunderous report",
        "a deafening announcement",
        "an apocalyptic noise"
      ];

      // Short headline. It does not need to be unique by itself;
      // the description below is guaranteed unique for every score.
      let name;
      if (a === 9 && smell === 1 && sound === 9) {
        name = "A big loud nothing";
      } else {
        const nounIndex = Math.max(a, smell, sound);
        name = `A ${headlineAmount[a]} ${headlineSound[sound]} ${headlineSmell[smell]} ${headlineNouns[nounIndex]}`;
      }

      const description =
        `Score ${code}. ${amountPhrase[a]}, ${smellPhrase[smell]}, and ${soundPhrase[sound]}. ${punchline}`;

      return { emoji, name, description };
    }

    function currentClassification() {
      return classificationFor(values[0], values[1], values[2]);
    }

    function getAudio() {
      if (!audioContext) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        audioContext = new C();
      }
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function blip(score) {
      const ctx = getAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "square";
      osc.frequency.setValueAtTime(190 + score * 42, now);
      osc.frequency.exponentialRampToValueAtTime(90 + score * 22, now + .075);
      gain.gain.setValueAtTime(.0001, now);
      gain.gain.exponentialRampToValueAtTime(.07, now + .004);
      gain.gain.exponentialRampToValueAtTime(.0001, now + .095);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + .105);
    }

    items.forEach((item,index)=>{
      const row = document.createElement("div");
      row.className = "meter-row";

      const label = document.createElement("div");
      label.className = "meter-label";
      label.innerHTML = `<div class="meter-name">${item[0]} // ${item[1]}</div><div class="meter-help">${item[2]}</div>`;

      const track = document.createElement("div");
      track.className = "meter-track";
      track.dataset.index = String(index);
      track.setAttribute("role","group");
      track.setAttribute("aria-label", `${item[1]} score`);

      for (let score=0; score<10; score++) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "pixel-block";
        button.dataset.score = String(score);
        button.setAttribute("aria-label", `${item[1]} ${score} out of 9`);

        button.addEventListener("click", ()=>{
          values[index] = score;
          blip(score);
          update();
        });

        track.appendChild(button);
      }

      const value = document.createElement("div");
      value.id = `meter-value-${index}`;
      value.className = "meter-value";
      value.textContent = "0";

      row.append(label, track, value);
      meters.appendChild(row);
    });

    function animateCode(code) {
      const spans = document.querySelectorAll("#code span");
      spans.forEach((span,index)=>{
        const next = code[index] ?? "0";
        if (span.textContent !== next) {
          span.textContent = next;
          span.classList.remove("roll");
          void span.offsetWidth;
          span.classList.add("roll");
        }
      });
    }

    function update() {
      const tracks = document.querySelectorAll(".meter-track");

      tracks.forEach((track,index)=>{
        const value = values[index] ?? 0;
        const palette = palettes[index];

        track.style.setProperty("--meter-gradient", `linear-gradient(135deg,${palette[0]},${palette[1]} 52%,${palette[2]})`);
        track.style.setProperty("--meter-glow", palette[3]);

        track.querySelectorAll(".pixel-block").forEach(block=>{
          const score = Number(block.dataset.score);
          block.classList.toggle("active", score <= value && value > 0);
          block.classList.toggle("selected", score === value);
          block.setAttribute("aria-pressed", score === value ? "true" : "false");
          block.style.opacity = score <= value && value > 0 ? String(.5 + score * .055) : "1";
        });

        const valueEl = document.getElementById(`meter-value-${index}`);
        if (valueEl) valueEl.textContent = String(value);
      });

      const c = currentClassification();
      const code = values.join("");

      animateCode(code);

      const classificationEl = document.getElementById("classification");
      const verdictNameEl = document.getElementById("verdict-name");
      const descriptionEl = document.getElementById("description");
      const summaryEl = document.getElementById("summary");

      if (classificationEl) classificationEl.textContent = `${c.emoji} ${c.name}`;
      if (verdictNameEl) verdictNameEl.textContent = `${c.emoji} ${c.name}`;
      if (descriptionEl) descriptionEl.textContent = c.description;
      if (summaryEl) summaryEl.textContent = `A ${values[0]} · S ${values[1]} · S ${values[2]}`;
    }

    function getShareText() {
      const c = currentClassification();
      return `${values.join("")}\n${c.emoji} ${c.name}`;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const t = document.createElement("textarea");
      t.value = text;
      t.setAttribute("readonly","");
      t.style.position = "fixed";
      t.style.opacity = "0";
      document.body.appendChild(t);
      t.select();
      const copied = document.execCommand("copy");
      t.remove();
      return copied;
    }

    function confirmTransmission(button) {
      button.classList.add("transmitted");
      button.textContent = "✓ TRANSMITTED";
      setTimeout(()=>{
        button.classList.remove("transmitted");
        button.textContent = "TRANSMIT SCORE";
      },2000);
    }

    document.getElementById("transmit").addEventListener("click", async ()=>{
      const button = document.getElementById("transmit");
      blip(9);
      const text = getShareText();

      if (navigator.share) {
        try {
          await navigator.share({ text });
          confirmTransmission(button);
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }

      try {
        const ok = await copyText(text);
        if (!ok) throw new Error("copy failed");
        confirmTransmission(button);
      } catch {
        button.textContent = "COPY FAILED";
        setTimeout(()=>button.textContent="TRANSMIT SCORE",2000);
      }
    });

    const riff=[40,40,43,40,46,45,43,38,40,40,47,46,43,42,38,35];
    const noteToFreq=note=>440*Math.pow(2,(note-69)/12);

    function tone(note,time,duration,type,volume){
      const ctx=getAudio();
      if(!ctx)return;
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type=type;
      osc.frequency.setValueAtTime(noteToFreq(note),time);
      gain.gain.setValueAtTime(.0001,time);
      gain.gain.exponentialRampToValueAtTime(volume,time+.005);
      gain.gain.exponentialRampToValueAtTime(.0001,time+duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(time);
      osc.stop(time+duration+.03);
    }

    function scheduleMusic(){
      const ctx=getAudio();
      if(!ctx)return;
      while(nextNoteTime<ctx.currentTime+.14){
        const note=riff[musicStep%riff.length];
        tone(note,nextNoteTime,.09,"square",.045);
        tone(note-12,nextNoteTime,.1,"sawtooth",.022);
        if(musicStep%4===0)tone(note-24,nextNoteTime,.18,"triangle",.035);
        nextNoteTime+=.105;
        musicStep++;
      }
    }

    document.getElementById("music-toggle").addEventListener("click",()=>{
      const button=document.getElementById("music-toggle");
      const ctx=getAudio();
      if(!ctx){button.textContent="AUDIO UNSUPPORTED";return}

      if(musicTimer){
        clearInterval(musicTimer);
        musicTimer=null;
        button.setAttribute("aria-pressed","false");
        button.textContent="▶ START MUSIC";
      }else{
        nextNoteTime=ctx.currentTime+.05;
        musicStep=0;
        scheduleMusic();
        musicTimer=setInterval(scheduleMusic,45);
        button.setAttribute("aria-pressed","true");
        button.textContent="■ STOP MUSIC";
      }
    });

    update();
  </script>
</body>
</html>
