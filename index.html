const inputs=[...document.querySelectorAll('input[type="range"]')];
const values=[0,0,0];
const valueEls=[...document.querySelectorAll(".value")];
const code=document.getElementById("code");
const resultEmoji=document.getElementById("resultEmoji");
const resultName=document.getElementById("resultName");
const resultDesc=document.getElementById("resultDesc");
function render(){
  const key=values.join("");
  const r=resultLibrary[key];
  valueEls.forEach((el,i)=>el.textContent=values[i]);
  code.textContent=key;
  resultEmoji.textContent=r.emoji;
  resultName.textContent=r.name;
  resultDesc.textContent=r.description;
}

// V10: mobile-safe native WAV pool.
const SOUND_POOL_SIZE=4;
const soundPools=Array.from({length:10},(_,value)=>
  Array.from({length:SOUND_POOL_SIZE},()=>{
    const audio=new Audio(`ass-step-${value}-v7.wav`);
    audio.preload="auto";
    audio.volume=0.68;
    audio.load();
    return audio;
  })
);
const soundPoolCursor=new Array(10).fill(0);
let lastSoundValue=-1;
let lastSoundAt=0;

function primeNativeAudio(){
  soundPools.flat().forEach(audio=>audio.load());
}
function playSliderSound(value){
  const now=performance.now();
  if(value===lastSoundValue && now-lastSoundAt<24)return;
  lastSoundValue=value;
  lastSoundAt=now;
  const pool=soundPools[value];
  if(!pool)return;
  const cursor=soundPoolCursor[value];
  const audio=pool[cursor];
  soundPoolCursor[value]=(cursor+1)%SOUND_POOL_SIZE;
  try{
    audio.currentTime=0;
    const playback=audio.play();
    if(playback && playback.catch)playback.catch(()=>{});
  }catch(e){}
}
["touchstart","pointerdown","mousedown","keydown"].forEach(evt=>{
  document.addEventListener(evt,primeNativeAudio,{once:true,passive:evt!=="keydown"});
});
inputs.forEach((input,i)=>{
  input.addEventListener("input",()=>{
    values[i]=parseInt(input.value,10);
    render();
    playSliderSound(values[i]);
  });
});
const shareButton=document.getElementById("shareButton");
const shareStatus=document.getElementById("shareStatus");
shareButton.addEventListener("click",async()=>{
  const key=values.join(""),r=resultLibrary[key],text=`${key} — ${r.name} ${r.emoji}`;
  try{
    if(navigator.share){await navigator.share({text});shareStatus.textContent="SCORE TRANSMITTED";}
    else if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(text);shareStatus.textContent="SCORE COPIED";}
    else{shareStatus.textContent=text;}
  }catch(err){if(err && err.name!=="AbortError")shareStatus.textContent="TRANSMISSION FAILED";}
});
render();

// Draw bulbs along all four viewport edges. No images or libraries required.
(function installChristmasLights(){
 const frame=document.getElementById("lightFrame");
 const colors=["#ff4453","#ffdc64","#5eea99","#71c9ff","#f7f4dc"];
 let previous="";
 function draw(){
  const w=window.innerWidth,h=window.innerHeight;
  const countX=Math.max(8,Math.ceil(w/30)),countY=Math.max(8,Math.ceil(h/30));
  const signature=countX+":"+countY;
  if(signature===previous)return;
  previous=signature;
  const spots=[];
  for(let i=0;i<=countX;i++){const x=14+(w-28)*i/countX;spots.push([x,14,0],[x,h-14,180]);}
  for(let i=1;i<countY;i++){const y=14+(h-28)*i/countY;spots.push([14,y,-90],[w-14,y,90]);}
  frame.replaceChildren();
  spots.forEach(([x,y,rot],i)=>{
   const bulb=document.createElement("span");
   bulb.className="bulb";
   bulb.style.left=x+"px";bulb.style.top=y+"px";
   bulb.style.setProperty("--rotation",rot+"deg");
   bulb.style.setProperty("--bulb",colors[i%colors.length]);
   bulb.style.setProperty("--delay",(-((i*7)%13)*.17)+"s");
   frame.appendChild(bulb);
  });
 }
 draw();window.addEventListener("resize",draw,{passive:true});
})();
