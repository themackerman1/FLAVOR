<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07030f">
  <meta name="description" content="FLAVOR — rate atmospheric damage across six highly scientific categories.">
  <title>F L A V O R</title>

  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <style>
    :root {
      color-scheme: dark;
      --cyan:#67e8f9;
      --pink:#ec4899;
      --green:#84f542;
      --yellow:#fde68a;
      --panel:rgba(10,6,32,.78);
      --border:rgba(103,232,249,.28);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background:#050312; }

    body {
      margin:0;
      min-height:100vh;
      padding:18px;
      color:#fdf4ff;
      background:
        radial-gradient(circle at 50% 5%, rgba(132,245,66,.12), transparent 23%),
        radial-gradient(circle at 50% 8%, rgba(255,68,202,.20), transparent 36%),
        linear-gradient(180deg,#17062c 0%,#0a0620 48%,#050312 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea { font: inherit; }

    button:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .synth-app {
      position:relative;
      isolation:isolate;
      width:min(980px,100%);
      margin:0 auto;
      overflow:hidden;
      border:1px solid rgba(132,245,66,.5);
      border-radius:28px;
      padding:22px;
      background:
        radial-gradient(circle at 50% 8%,rgba(132,245,66,.10),transparent 22%),
        radial-gradient(circle at 50% 8%,rgba(255,68,202,.20),transparent 34%),
        linear-gradient(180deg,#17062c 0%,#0a0620 48%,#050312 100%);
      box-shadow:
        inset 0 0 0 1px rgba(103,232,249,.16),
        0 0 30px rgba(132,245,66,.12);
    }

    .scanlines {
      position:absolute;
      inset:0;
      pointer-events:none;
      opacity:.15;
      background:repeating-linear-gradient(
        180deg,
        transparent 0,
        transparent 3px,
        rgba(255,255,255,.08) 4px
      );
      mix-blend-mode:screen;
    }

    .sun {
      position:absolute;
      top:118px;
      left:50%;
      width:210px;
      height:105px;
      transform:translateX(-50%);
      border-radius:210px 210px 0 0;
      opacity:.16;
      background:repeating-linear-gradient(
        180deg,
        #84f542 0,
        #84f542 7px,
        #7e22ce 8px,
        #7e22ce 12px
      );
      pointer-events:none;
    }

    .grid-floor {
      position:absolute;
      left:-15%;
      right:-15%;
      bottom:-90px;
      height:280px;
      opacity:.16;
      transform:perspective(360px) rotateX(62deg);
      transform-origin:bottom;
      background-image:
        linear-gradient(rgba(132,245,66,.7) 1px,transparent 1px),
        linear-gradient(90deg,rgba(236,72,153,.7) 1px,transparent 1px);
      background-size:42px 42px;
      pointer-events:none;
    }

    .content { position:relative; z-index:1; }

    header {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:18px;
      margin-bottom:26px;
      text-align:left;
    }

    .app-tile {
      width:88px;
      height:88px;
      flex:0 0 auto;
      overflow:hidden;
      border:2px solid var(--green);
      border-radius:18px;
      background:#07030f;
      box-shadow:
        0 0 12px var(--green),
        0 0 28px rgba(132,245,66,.38);
    }

    .app-tile img {
      display:block;
      width:100%;
      height:100%;
      image-rendering:pixelated;
    }

    .arcade-kicker,
    .panel-label {
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:.72rem;
      letter-spacing:.22em;
      color:var(--cyan);
    }

    .arcade-title {
      margin:.25rem 0 0;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:clamp(2.5rem,8vw,5rem);
      font-weight:900;
      line-height:.95;
      letter-spacing:.12em;
      color:white;
      text-shadow:
        3px 3px 0 var(--green),
        -3px -3px 0 #7e22ce,
        0 0 18px rgba(132,245,66,.55);
    }

    .music-button,
    .arcade-button {
      border:1px solid var(--cyan);
      border-radius:10px;
      padding:.78rem 1rem;
      color:white;
      background:linear-gradient(135deg,#3f1d74,#9d174d);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:.75rem;
      font-weight:900;
      letter-spacing:.07em;
      cursor:pointer;
      box-shadow:0 0 14px rgba(219,39,119,.35);
      transition:transform .12s ease, filter .12s ease, background .12s ease, box-shadow .12s ease;
    }

    .music-button:hover,
    .arcade-button:hover {
      transform:translateY(-1px);
      filter:brightness(1.15);
    }

    .music-button[aria-pressed="true"] {
      border-color:var(--green);
      background:linear-gradient(135deg,#14532d,#3f6212);
      box-shadow:0 0 16px rgba(132,245,66,.5);
    }

    .bars {
      display:grid;
      gap:15px;
    }

    .meter-row {
      display:grid;
      grid-template-columns:minmax(110px,150px) 1fr 42px;
      gap:.8rem;
      align-items:center;
    }

    .meter-name {
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:.82rem;
      font-weight:800;
      letter-spacing:.08em;
      color:#f5d0fe;
    }

    .meter-help {
      margin-top:.18rem;
      font-size:.72rem;
      line-height:1.28;
      color:#a5b4fc;
    }

    .meter-track {
      display:grid;
      grid-template-columns:repeat(10,minmax(0,1fr));
      gap:5px;
    }

    .meter-level {
      min-width:0;
      height:40px;
      border:1px solid rgba(129,140,248,.35);
      border-radius:7px;
      color:#7dd3fc;
      background:rgba(16,12,43,.84);
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:.75rem;
      cursor:pointer;
      transition:transform .12s ease,filter .12s ease,opacity .12s ease;
      box-shadow:inset 0 0 12px rgba(76,29,149,.18);
    }

    .meter-level:hover {
      transform:translateY(-2px);
      filter:brightness(1.25);
    }

    .meter-level.active {
      color:white;
      border-color:transparent;
      background:var(--meter-gradient);
      box-shadow:
        0 0 10px var(--meter-glow),
        inset 0 0 10px rgba(255,255,255,.16);
    }

    .meter-level.selected {
      outline:2px solid white;
      outline-offset:2px;
    }

    .meter-value {
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:1.2rem;
      font-weight:900;
      color:var(--green);
      text-align:center;
      text-shadow:0 0 10px rgba(132,245,66,.75);
    }

    .score-grid {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      margin-top:22px;
    }

    .neon-panel,
    .verdict-panel,
    .share-panel {
      border:1px solid var(--border);
      background:var(--panel);
      box-shadow:
        inset 0 0 18px rgba(76,29,149,.18),
        0 0 14px rgba(132,245,66,.06);
    }

    .neon-panel {
      border-radius:14px;
      padding:1rem;
      text-align:center;
    }

    .score-value {
      margin-top:.38rem;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:1.45rem;
      font-weight:900;
      color:white;
      text-shadow:0 0 12px rgba(34,211,238,.65);
    }

    .result-title {
      margin-top:.4rem;
      color:#d9ff57;
      font-weight:800;
    }

    .verdict-panel {
      margin-top:12px;
      border-radius:18px;
      padding:1.25rem;
      text-align:center;
    }

    .verdict-name {
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:1.12rem;
      font-weight:900;
      color:var(--yellow);
      text-shadow:0 0 12px rgba(250,204,21,.5);
    }

    .verdict-copy {
      margin:.55rem 0 0;
      color:#e9d5ff;
    }

    .summary-line {
      margin:.8rem 0 0;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      font-size:.82rem;
      color:var(--cyan);
    }

    .share-panel {
      display:flex;
      justify-content:center;
      margin-top:12px;
      border-radius:18px;
      padding:16px;
    }

    .arcade-button {
      min-width:min(100%,320px);
      padding:1rem 1.25rem;
      font-size:.82rem;
    }

    .arcade-button.transmitted {
      border-color:var(--green);
      color:#07110a;
      background:linear-gradient(135deg,#d9ff57,#84f542);
      box-shadow:
        0 0 10px rgba(132,245,66,.95),
        0 0 28px rgba(132,245,66,.75),
        inset 0 0 10px rgba(255,255,255,.65);
      animation:transmitFlash .18s ease-in-out 2 alternate;
    }

    @keyframes transmitFlash {
      from { transform:scale(1); filter:brightness(1); }
      to { transform:scale(1.025); filter:brightness(1.35); }
    }

    @media (max-width:760px) {
      body { padding:10px; }
      .synth-app { padding:17px; border-radius:22px; }

      header {
        flex-direction:column;
        text-align:center;
      }

      .meter-row {
        grid-template-columns:1fr 38px;
      }

      .meter-label-block {
        grid-column:1 / -1;
      }

      .meter-help { display:none; }

      .score-grid {
        grid-template-columns:1fr;
      }
    }

    @media (max-width:500px) {
      .meter-track { gap:3px; }
      .meter-level {
        height:35px;
        border-radius:5px;
        font-size:.66rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior:auto !important;
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="synth-app">
    <div class="scanlines" aria-hidden="true"></div>
    <div class="sun" aria-hidden="true"></div>
    <div class="grid-floor" aria-hidden="true"></div>

    <div class="content">
      <header>
        <div class="app-tile">
          <img src="icon.svg" alt="Green pixel-art skull and crossbones">
        </div>

        <div>
          <div class="arcade-kicker">ATMOSPHERIC DAMAGE ANALYZER</div>
          <h1 class="arcade-title">FLAVOR</h1>
        </div>

        <button id="music-toggle" class="music-button" type="button" aria-pressed="false">
          ▶ START MUSIC
        </button>
      </header>

      <section id="flavor-bars" class="bars" aria-label="FLAVOR score controls"></section>

      <section class="score-grid" aria-label="Score summary">
        <div class="neon-panel">
          <div class="panel-label">GAS CRIME CODE</div>
          <div id="flavor-code" class="score-value">000000</div>
        </div>

        <div class="neon-panel">
          <div class="panel-label">TOTAL DAMAGE</div>
          <div id="total-score" class="score-value">0 / 54</div>
        </div>

        <div class="neon-panel">
          <div class="panel-label">FINAL CLASSIFICATION</div>
          <div id="flavor-badge" class="result-title">😇 Administrative Error</div>
        </div>
      </section>

      <section class="verdict-panel" aria-live="polite">
        <div id="verdict-name" class="verdict-name">😇 Administrative Error</div>
        <p id="flavor-taunt" class="verdict-copy">
          No measurable incident. The paperwork is somehow more dangerous than you are.
        </p>
        <p id="flavor-summary" class="summary-line">F 0 · L 0 · A 0 · V 0 · O 0 · R 0</p>
      </section>

      <section class="share-panel">
        <button id="share-button" class="arcade-button" type="button">TRANSMIT SCORE</button>
      </section>
    </div>
  </main>

  <script>
    "use strict";

    const items = [
      ["F","Frequency","How often did the trumpet of doom sound?"],
      ["L","Length","How long did this cursed side quest last?"],
      ["A","Audibility","Could witnesses identify the culprit by sound alone?"],
      ["V","Volume","How much invisible betrayal entered the arena?"],
      ["O","Odor","How aggressively did the air file a complaint?"],
      ["R","Recipients","How many innocent bystanders lost faith in humanity?"]
    ];

    const names = [
      "Administrative Error","Ghost Protocol","Suspicious Draft","Invisible Accomplice",
      "Featherweight Felony","Silent Side Quest","Budget Balloon","Stealth Tutorial",
      "Minor Incident Report","Beginner Trap","Sock Drawer Ambush","Courtesy Warning",
      "Dungeon Rat Special","Unlicensed Experiment","Awkward Intermission",
      "Open-A-Window Tier","Ventilation Request","Social Armor Check",
      "Dog-Blame Difficulty","Audible Side Effect","Mediocre Curse","Candle Threat Level",
      "Morale Debuff","Conversation Killer","Public Denial Phase","Skunk Internship",
      "Room Hazard","Mild Necromancy","Consent Violation of Oxygen",
      "Emergency Febreze Event","Tactical Relocation","Bridge Troll Tribute",
      "Boss Room Notification","Area-of-Effect Damage","Cursed Aura",
      "Restricted Airspace","Cheek-Sealed Explosive","Stagger Damage",
      "Legendary Trap Room","Toxic Encounter","Boss-Level Gas Attack",
      "Party Wipe Attempt","Genetic Memory Event","Biohazard Achievement",
      "Evacuation Optional","Alien Atmosphere","Internal Volcano","Reality Leak",
      "Dragon Breath, Wrong End","Structural Concern","Indoor Weather System",
      "Ancient Curse Unsealed","Orbital Detection Event","Extinction-Level Emission",
      "Final Boss: Atmosphere"
    ];

    const icons = [
      "😇","🫧","🌬️","🕵️","🪶","🤫","🎈","🥷","📎","🪤","🧦","🛎️","🐁","🧪",
      "🫣","🚪","🪟","🛡️","🐕","📣","🧙","🕯️","🥴","🪦","🎭","🦨","⚠️","🧟",
      "🛑","🧯","🏃","🧌","🔔","💢","🪄","🚧","🧨","😵","🪤","🦂","💀","☠️",
      "🧬","☣️","🚨","🛸","🌋","🕳️","🐉","🏚️","🌪️","🧿","🛰️","☄️","💥"
    ];

    const descriptions = [
      "No measurable incident. The paperwork is somehow more dangerous than you are.",
      "A rumor of gas passed through the room and immediately hired a lawyer.",
      "Barely detectable. A curtain moved and now everyone is accusing the HVAC.",
      "Something happened, but the evidence is weak and the dog looks nervous.",
      "Technically a crime, emotionally a rounding error.",
      "A tiny event with no loot, no witnesses, and somehow still no dignity.",
      "Light pressure, modest consequences, absolutely no production value.",
      "Quiet, controlled, and disappointingly competent.",
      "Human resources has opened a file nobody intends to read.",
      "The room noticed. Trust did not survive.",
      "Mild, enclosed, and weirdly personal.",
      "A polite little announcement that worse decisions are available.",
      "Small, sneaky, and clearly raised without supervision.",
      "The results are inconclusive, but the ethics board has resigned.",
      "Conversation stopped just long enough for everyone to become suspicious.",
      "Not an emergency, but the architecture is now involved.",
      "The room has submitted a formal petition for outside air.",
      "Somebody laughed. Somebody else will never trust you again.",
      "The pet has been framed with the confidence of a career criminal.",
      "Subtlety has left the building and taken the alibi with it.",
      "Annoying, persistent, and definitely cast by an underpaid wizard.",
      "One scented candle has been deployed. It is losing.",
      "Everyone remains conscious, but enthusiasm has taken damage.",
      "The topic died instantly. No one is attending the funeral.",
      "Everyone knows. Nobody admits knowing. Civilization continues somehow.",
      "Promising technique, alarming potential, no professional certification.",
      "The air has become a gameplay mechanic.",
      "Something dead has entered the room without opening the door.",
      "The atmosphere did not agree to participate in this.",
      "Spray bottles are being drawn like sidearms.",
      "Witnesses are moving with purpose and pretending it is unrelated.",
      "Dense, hostile, and somehow charging admission.",
      "The music changed. Nobody is ready.",
      "Multiple targets affected. Friendly fire has been enabled.",
      "The source is unclear, but the debuff is definitely magical.",
      "Movement is permitted. Breathing is discouraged.",
      "Compact delivery system. Questionable safety record.",
      "The nearest witness has lost one full turn.",
      "The exit is visible, but dignity is blocking the path.",
      "This is no longer comedy. It is environmental storytelling.",
      "The room has entered its second phase.",
      "Several people are reconsidering the value of teamwork.",
      "Future generations may instinctively avoid this location.",
      "Congratulations. The building has unlocked a new warning label.",
      "Leaving is technically voluntary in the same way survival is optional.",
      "Earth scientists have declined comment and quietly gone home.",
      "Pressure was released. History will not be kind.",
      "The smell appears to originate from a dimension with worse standards.",
      "Mythical output. Tragically inaccurate anatomy.",
      "The building remains upright, but emotionally it has collapsed.",
      "The room now has climate, seasons, and a hostile forecast.",
      "Archaeologists warned you. You did not listen because nobody ever does.",
      "Satellites have noticed. International relations are deteriorating.",
      "The fossil record will be unhelpfully specific about this moment.",
      "Maximum score. The air has been defeated and refuses a rematch."
    ];

    const palettes = [
      ["#22d3ee","#2563eb","#8b5cf6","rgba(34,211,238,.7)"],
      ["#a78bfa","#7c3aed","#ec4899","rgba(167,139,250,.7)"],
      ["#facc15","#fb7185","#db2777","rgba(250,204,21,.65)"],
      ["#67e8f9","#06b6d4","#6366f1","rgba(103,232,249,.7)"],
      ["#84f542","#22c55e","#0891b2","rgba(132,245,66,.7)"],
      ["#f0abfc","#c026d3","#4f46e5","rgba(240,171,252,.7)"]
    ];

    const values = [0,0,0,0,0,0];
    const bars = document.getElementById("flavor-bars");

    let audioContext = null;
    let masterGain = null;
    let musicTimer = null;
    let nextNoteTime = 0;
    let musicStep = 0;

    function getAppUrl() {
      return window.location.href.split("#")[0].split("?")[0];
    }

    async function unlockAudio() {
      const AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;

      if (!audioContext) {
        audioContext = new AudioCtor();
        masterGain = audioContext.createGain();
        masterGain.gain.value = 0.72;
        masterGain.connect(audioContext.destination);
      }

      if (audioContext.state === "suspended") {
        await audioContext.resume();
      }

      return audioContext;
    }

    async function playButtonSound(score) {
      const ctx = await unlockAudio();
      if (!ctx || !masterGain) return;

      const now = ctx.currentTime + 0.005;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "square";
      osc.frequency.setValueAtTime(190 + score * 42, now);
      osc.frequency.exponentialRampToValueAtTime(90 + score * 22, now + 0.075);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.085, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.095);

      osc.connect(gain).connect(masterGain);
      osc.start(now);
      osc.stop(now + 0.105);
    }

    items.forEach((item, index) => {
      const row = document.createElement("div");
      row.className = "meter-row";

      const label = document.createElement("div");
      label.className = "meter-label-block";
      label.innerHTML = `
        <div class="meter-name">${item[0]} // ${item[1]}</div>
        <div class="meter-help">${item[2]}</div>
      `;

      const track = document.createElement("div");
      track.className = "meter-track";
      track.tabIndex = 0;
      track.setAttribute("role", "slider");
      track.setAttribute("aria-label", `${item[1]} score`);
      track.setAttribute("aria-valuemin", "0");
      track.setAttribute("aria-valuemax", "9");
      track.setAttribute("aria-valuenow", "0");

      for (let score = 0; score < 10; score++) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "meter-level";
        button.dataset.score = String(score);
        button.textContent = String(score);
        button.setAttribute("aria-label", `${item[1]} ${score} out of 9`);

        button.addEventListener("click", async () => {
          await unlockAudio();
          playButtonSound(score);
          values[index] = score;
          update();
        });

        track.appendChild(button);
      }

      track.addEventListener("keydown", async (event) => {
        let changed = false;

        if (["ArrowRight","ArrowUp"].includes(event.key)) {
          event.preventDefault();
          values[index] = Math.min(9, values[index] + 1);
          changed = true;
        }

        if (["ArrowLeft","ArrowDown"].includes(event.key)) {
          event.preventDefault();
          values[index] = Math.max(0, values[index] - 1);
          changed = true;
        }

        if (event.key === "Home") {
          event.preventDefault();
          values[index] = 0;
          changed = true;
        }

        if (event.key === "End") {
          event.preventDefault();
          values[index] = 9;
          changed = true;
        }

        if (changed) {
          await unlockAudio();
          playButtonSound(values[index]);
          update();
        }
      });

      const value = document.createElement("div");
      value.id = `meter-value-${index}`;
      value.className = "meter-value";
      value.textContent = "0";

      row.append(label, track, value);
      bars.appendChild(row);
    });

    function update() {
      let total = 0;

      document.querySelectorAll(".meter-track").forEach((track, index) => {
        const value = values[index];
        const palette = palettes[index];
        total += value;

        track.style.setProperty(
          "--meter-gradient",
          `linear-gradient(135deg,${palette[0]},${palette[1]} 52%,${palette[2]})`
        );
        track.style.setProperty("--meter-glow", palette[3]);
        track.setAttribute("aria-valuenow", String(value));

        track.querySelectorAll(".meter-level").forEach((level) => {
          const score = Number(level.dataset.score);
          level.classList.toggle("active", score <= value && value > 0);
          level.classList.toggle("selected", score === value);
          level.style.opacity =
            score <= value && value > 0 ? String(0.48 + score * 0.058) : "1";
        });

        document.getElementById(`meter-value-${index}`).textContent = String(value);
      });

      document.getElementById("flavor-code").textContent = values.join("");
      document.getElementById("total-score").textContent = `${total} / 54`;
      document.getElementById("flavor-badge").textContent = `${icons[total]} ${names[total]}`;
      document.getElementById("verdict-name").textContent = `${icons[total]} ${names[total]}`;
      document.getElementById("flavor-taunt").textContent = descriptions[total];
      document.getElementById("flavor-summary").textContent =
        `F ${values[0]} · L ${values[1]} · A ${values[2]} · V ${values[3]} · O ${values[4]} · R ${values[5]}`;
    }

    function getShareText() {
      const total = values.reduce((sum, value) => sum + value, 0);
      return `${values.join("")}\n${icons[total]} ${names[total]}\n${getAppUrl()}`;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }

      const temporary = document.createElement("textarea");
      temporary.value = text;
      temporary.setAttribute("readonly", "");
      temporary.style.position = "fixed";
      temporary.style.opacity = "0";
      document.body.appendChild(temporary);
      temporary.select();

      const copied = document.execCommand("copy");
      temporary.remove();
      return copied;
    }

    function confirmTransmission(button) {
      const original = "TRANSMIT SCORE";
      button.classList.add("transmitted");
      button.textContent = "✓ TRANSMITTED";

      window.setTimeout(() => {
        button.classList.remove("transmitted");
        button.textContent = original;
      }, 2000);
    }

    async function shareScore() {
      const button = document.getElementById("share-button");
      await unlockAudio();
      playButtonSound(9);

      const text = getShareText();

      if (navigator.share) {
        try {
          await navigator.share({ text });
          confirmTransmission(button);
          return;
        } catch (error) {
          if (error && error.name === "AbortError") return;
        }
      }

      try {
        const copied = await copyText(text);
        if (!copied) throw new Error("Copy command failed");
        confirmTransmission(button);
      } catch (error) {
        button.textContent = "COPY FAILED";
        window.setTimeout(() => {
          button.textContent = "TRANSMIT SCORE";
        }, 2000);
      }
    }

    document.getElementById("share-button").addEventListener("click", shareScore);

    const riff = [
      40,40,43,40,46,45,43,38,
      40,40,47,46,43,42,38,35,
      40,43,46,47,46,43,40,38,
      35,38,40,43,35,34,31,28
    ];

    const bass = [28,28,31,31,26,26,24,23];

    function noteToFreq(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    function tone(note, time, duration, type, volume, detune = 0) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();

      osc.type = type;
      osc.frequency.setValueAtTime(noteToFreq(note), time);
      osc.detune.setValueAtTime(detune, time);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(type === "sawtooth" ? 850 : 1500, time);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(volume, time + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      osc.connect(filter).connect(gain).connect(masterGain);
      osc.start(time);
      osc.stop(time + duration + 0.03);
    }

    function kick(time) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(170, time);
      osc.frequency.exponentialRampToValueAtTime(38, time + 0.13);

      gain.gain.setValueAtTime(0.18, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.15);

      osc.connect(gain).connect(masterGain);
      osc.start(time);
      osc.stop(time + 0.16);
    }

    function noiseHit(time, volume, duration) {
      const length = Math.floor(audioContext.sampleRate * duration);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / length);
      }

      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();

      source.buffer = buffer;
      filter.type = "highpass";
      filter.frequency.value = 1200;

      gain.gain.setValueAtTime(volume, time);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);

      source.connect(filter).connect(gain).connect(masterGain);
      source.start(time);
    }

    function scheduleMusic() {
      const stepDuration = 0.102;

      while (nextNoteTime < audioContext.currentTime + 0.15) {
        const position = musicStep % riff.length;
        const note = riff[position];

        tone(note, nextNoteTime, 0.09, "square", 0.055);
        tone(note - 12, nextNoteTime, 0.1, "sawtooth", 0.034, -9);
        tone(note - 12, nextNoteTime, 0.1, "sawtooth", 0.03, 9);

        if (musicStep % 2 === 0) {
          tone(bass[Math.floor(musicStep / 4) % bass.length], nextNoteTime, 0.18, "triangle", 0.05);
        }

        if (musicStep % 4 === 0) kick(nextNoteTime);
        if (musicStep % 8 === 4) noiseHit(nextNoteTime, 0.075, 0.09);
        if (musicStep % 2 === 1) noiseHit(nextNoteTime, 0.014, 0.025);

        nextNoteTime += stepDuration;
        musicStep++;
      }
    }

    async function toggleMusic() {
      const button = document.getElementById("music-toggle");
      const ctx = await unlockAudio();
      if (!ctx) {
        button.textContent = "AUDIO UNSUPPORTED";
        return;
      }

      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
        button.setAttribute("aria-pressed", "false");
        button.textContent = "▶ START DOOM CHIPTUNE";
        playButtonSound(2);
      } else {
        playButtonSound(9);
        nextNoteTime = ctx.currentTime + 0.08;
        musicStep = 0;
        scheduleMusic();
        musicTimer = window.setInterval(scheduleMusic, 40);
        button.setAttribute("aria-pressed", "true");
        button.textContent = "■ STOP DOOM CHIPTUNE";
      }
    }

    document.getElementById("music-toggle").addEventListener("click", toggleMusic);

    update();
  </script>
</body>
</html>
