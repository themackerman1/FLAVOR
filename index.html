function update(){document.getElementById("code").textContent=values.join("");values.forEach((v,i)=>{document.getElementById(`readout-${i}`).textContent=v;document.querySelectorAll(".meter")[i].querySelectorAll(".score").forEach((b,n)=>b.classList.toggle("active",n===v));});const r=classificationFor(...values);document.getElementById("title").textContent=`${r.emoji} ${r.name}`;document.getElementById("copy").textContent=r.description;}
document.getElementById("share").addEventListener("click",async()=>{const r=classificationFor(...values),text=`${values.join("")} — ${r.name} ${r.emoji}`;try{if(navigator.share)await navigator.share({text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);const b=document.getElementById("share");b.textContent="TRANSMISSION COPIED";setTimeout(()=>b.textContent="TRANSMIT SCORE",1300)}}catch(e){}});
let ctx=null,timer=null,musicOn=false;function ac(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();return ctx}function blip(n){try{const c=ac(),o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=140+n*24;g.gain.setValueAtTime(.035,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.06);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.065)}catch(e){}}function tick(){const c=ac(),now=c.currentTime;[55,82.4,110].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i?"sawtooth":"square";o.frequency.value=f;g.gain.setValueAtTime(.012/(i+1),now);g.gain.exponentialRampToValueAtTime(.001,now+.28);o.connect(g);g.connect(c.destination);o.start(now+i*.04);o.stop(now+.3)})}document.getElementById("music").addEventListener("click",async()=>{const c=ac();if(c.state==="suspended")await c.resume();musicOn=!musicOn;const b=document.getElementById("music");if(musicOn){tick();timer=setInterval(tick,360);b.textContent="STOP MUSIC"}else{clearInterval(timer);timer=null;b.textContent="START MUSIC"}});update();
</script></body></html>
