<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10120e"><title>ASS — Atmospheric Severity Score</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
 --bg:#070514;--panel:#0d0920;--panel2:#100a24;--text:#fff8ed;
 --muted:#9f99ba;--pink:#ff2aa8;--cyan:#31e8ff;--orange:#ff8a2b;--yellow:#ffd83d;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
 margin:0;min-height:100vh;color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 background:
   radial-gradient(circle at 50% 0,#24104a 0,#0d0822 42%,#05030d 78%),
   #05030d;
}
body:after{
 content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
 background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(0,0,0,.45) 5px)
}
.shell{width:min(980px,calc(100% - 28px));margin:auto;padding:14px 0 32px}
.masthead{
 overflow:hidden;border-radius:12px;background:#080516;
 box-shadow:0 0 30px rgba(255,42,168,.14)
}
.masthead img{display:block;width:100%;height:auto}
.hazard{height:2px;margin:18px 0;background:linear-gradient(90deg,transparent,var(--pink),var(--orange),var(--cyan),transparent);opacity:.75}
.panel,.reportWrap{
 position:relative;padding:20px;border:1px solid rgba(255,255,255,.11);border-radius:12px;
 background:linear-gradient(180deg,rgba(18,11,42,.94),rgba(8,6,20,.96));
 box-shadow:0 12px 35px rgba(0,0,0,.25)
}
.panelLabel,.reportLabel{
 margin:0 0 18px;color:var(--muted);font-size:11px;font-weight:700;
 letter-spacing:.14em;text-align:left;text-transform:uppercase
}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.control{
 padding:16px;border:1px solid rgba(255,255,255,.08);border-radius:10px;
 background:rgba(255,255,255,.025)
}
.controlTop{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.controlName{font-size:18px;font-weight:800;letter-spacing:-.01em}
.controlSub{margin-top:3px;color:var(--muted);font-size:11px;letter-spacing:0;text-transform:none}
.readout{
 min-width:44px;padding:5px 8px;border:0;border-radius:7px;text-align:center;
 color:#fff;font:800 26px/1 Arial,Helvetica,sans-serif;background:#18091e;
 box-shadow:inset 0 0 0 1px rgba(255,42,168,.45);text-shadow:0 0 10px var(--pink)
}
input[type=range]{width:100%;height:28px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{
 height:6px;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--cyan))
}
input[type=range]::-webkit-slider-thumb{
 appearance:none;-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border:3px solid #fff;
 border-radius:50%;background:var(--pink);box-shadow:0 0 12px rgba(255,42,168,.75)
}
input[type=range]::-moz-range-track{height:6px;border:0;border-radius:99px;background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow),var(--cyan))}
input[type=range]::-moz-range-thumb{width:17px;height:17px;border:3px solid #fff;border-radius:50%;background:var(--pink);box-shadow:0 0 12px rgba(255,42,168,.75)}
.reportWrap{margin-top:14px}
.codeBox{margin:0 0 18px;text-align:center}
.codeLabel{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.code{
 margin-top:5px;color:#fff;font:900 clamp(54px,10vw,88px)/.95 Arial,Helvetica,sans-serif;
 letter-spacing:.06em;font-variant-numeric:tabular-nums;
 text-shadow:0 0 8px #fff,0 0 20px var(--pink)
}
.screen{
 position:relative;overflow:hidden;min-height:160px;padding:22px;border:1px solid rgba(49,232,255,.24);
 border-radius:10px;background:linear-gradient(180deg,#071824,#09081b);
 box-shadow:inset 0 0 30px rgba(49,232,255,.035)
}
.resultEmoji{margin-bottom:7px;font-size:25px;text-align:center}
.resultName{
 position:relative;z-index:1;margin:0 0 10px;color:#fff;
 font:900 clamp(25px,4vw,36px)/1.05 Arial,Helvetica,sans-serif;
 letter-spacing:-.025em;text-align:center;text-transform:none;
 text-shadow:0 0 15px rgba(255,42,168,.55)
}
.resultDesc{
 position:relative;z-index:1;max-width:720px;margin:auto;color:#c9f9ff;
 font:400 15px/1.55 Arial,Helvetica,sans-serif;text-align:center
}
.shareRow{display:flex;justify-content:center;margin-top:16px}
.shareButton{
 min-height:48px;padding:0 25px;border:1px solid rgba(255,42,168,.75);border-radius:8px;
 background:#190b25;color:#fff;font:800 12px Arial,Helvetica,sans-serif;
 letter-spacing:.09em;cursor:pointer;box-shadow:0 0 18px rgba(255,42,168,.15)
}
.shareButton:hover{background:#251033;box-shadow:0 0 20px rgba(255,42,168,.3)}
.shareButton:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.shareStatus{min-height:15px;margin-top:8px;color:var(--cyan);font-size:10px;text-align:center}
.footer{padding-top:18px;color:#625c7d;font-size:9px;letter-spacing:.08em;text-align:center;text-transform:uppercase}
@media(max-width:720px){
 .shell{width:min(100% - 14px,980px);padding-top:7px}
 .hazard{margin:11px 0}
 .panel,.reportWrap{padding:13px}
 .panelLabel,.reportLabel{margin-bottom:12px}
 .controls{grid-template-columns:1fr;gap:8px}
 .control{padding:13px}
 .controlTop{margin-bottom:8px}
 .screen{padding:18px 13px}
 .resultDesc{font-size:14px}
 .shareButton{width:100%;min-height:52px}
}
</style></head>
