<style>

:root{--ink:#071f19;--navy:#0c3027;--violet:#123e30;--pink:#d73542;--cyan:#eacb84;--orange:#dfb46a;--yellow:#f6dfac;--white:#fff9e9;--muted:#b7c7ba}
*{box-sizing:border-box}
html{background:#061b16}
body{margin:0;min-height:100vh;color:var(--white);font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% -12%,#215e44 0,#103c30 36%,#061e19 90%)}
.app{position:relative;width:min(920px,calc(100% - 54px));margin:auto;padding:34px 0 42px}
.hero{position:relative;overflow:hidden;min-height:270px;padding:37px 42px;border-radius:16px;border:1px solid rgba(255,220,157,.48);background:radial-gradient(circle at 85% 15%,rgba(247,216,155,.13),transparent 43%),linear-gradient(130deg,#164d3b,#09291f);box-shadow:0 22px 55px #041610aa}
.hero:before{content:"";position:absolute;inset:12px;border:1px solid rgba(242,220,166,.22);border-radius:9px;pointer-events:none}
.hero:after{content:"";position:absolute;right:-110px;bottom:-155px;width:370px;height:370px;border:2px solid rgba(246,217,157,.16);border-radius:50%;box-shadow:0 0 0 36px rgba(255,238,200,.02),0 0 0 75px rgba(255,238,200,.018);pointer-events:none}
.heroKicker{position:relative;z-index:1;color:#e9cb8c;font-size:11px;font-weight:900;letter-spacing:.19em}
.heroKicker span{padding:0 9px;color:#f2d4a3}
.hero h1{position:relative;z-index:1;margin:14px 0 0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(90px,16vw,160px);line-height:1;font-weight:700;letter-spacing:-.08em;color:#fff9e8;text-shadow:0 5px 0 #07251d}
.heroDot{color:#e23f47}
.heroSub{position:relative;z-index:1;margin:14px 0 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:clamp(16px,2.4vw,22px);color:#f1dba9}
.heroRule{position:relative;z-index:1;margin-top:25px;width:145px;height:5px;border-radius:8px;background:repeating-linear-gradient(90deg,#d93d47 0 18px,#fff6dc 18px 36px)}
.console{margin-top:16px;overflow:hidden;border:1px solid rgba(234,203,132,.28);border-radius:14px;background:rgba(9,42,32,.95);box-shadow:0 15px 35px #06160fb0}
.consoleHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12);background:linear-gradient(90deg,rgba(210,52,64,.23),transparent)}
.consoleTitle{font-size:11px;font-weight:900;letter-spacing:.14em}
.status{display:flex;align-items:center;gap:7px;color:#e5d6a5;font-size:10px;font-weight:800;letter-spacing:.1em}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:#e43d49;box-shadow:0 0 10px #e43d49}
.channels{padding:2px 16px}
.channel{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.channel:last-child{border-bottom:0}
.channelName{font-size:14px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#f4e5bc}
.value{font-size:25px;font-weight:900;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:34px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#c63441 0%,#f6e9d2 52%,#2c9b68 100%)}
input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:27px;height:27px;margin-top:-10px;border:4px solid #fff9e8;border-radius:50%;background:#d63c45;box-shadow:0 0 12px #d63c4580}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#c63441,#f6e9d2,#2c9b68)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:4px solid #fff9e8;border-radius:50%;background:#d63c45}
.result{margin-top:16px;border:1px solid rgba(238,207,144,.42);border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#184a36,#0d3026)}
.resultTop{display:grid;grid-template-columns:145px 1fr;min-height:122px}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;border-right:1px solid rgba(255,255,255,.11);background:rgba(204,47,57,.18)}
.scoreLabel{font-size:9px;font-weight:900;letter-spacing:.14em;color:#e5cda0;text-transform:uppercase}
.code{margin-top:5px;font-size:48px;font-weight:900;line-height:1;letter-spacing:.02em;color:#fff}
.classification{display:flex;flex-direction:column;justify-content:center;padding:20px 22px}
.eyebrow{margin-bottom:7px;color:#f1d69a;font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.resultLine{display:flex;align-items:center;gap:9px}
.resultEmoji{font-size:24px}
.resultName{margin:0;font-size:23px;font-weight:900;line-height:1.13;letter-spacing:-.015em}
.resultDesc{margin:0;padding:17px 20px;border-top:1px solid rgba(255,255,255,.11);color:#f5ebd7;font-size:14px;line-height:1.6}
.actions{display:flex;justify-content:flex-end;padding:12px 16px;border-top:1px solid rgba(255,255,255,.08)}
.shareButton{min-height:44px;padding:0 18px;border:1px solid #edc785;border-radius:8px;background:#b52f3a;color:#fffdf1;font-size:11px;font-weight:900;letter-spacing:.09em;cursor:pointer}
.shareButton:hover{background:#d23b47}
.shareButton:focus-visible{outline:3px solid #f4d990;outline-offset:3px}
.shareStatus{align-self:center;min-width:85px;margin-right:auto;color:#e9d396;font-size:9px;letter-spacing:.06em}
.footer{padding:19px 0 0;color:#b9c9b8;font-size:10px;letter-spacing:.14em;text-align:center;text-transform:uppercase}
/* Fixed viewport Christmas light garland, rendered entirely by CSS + DOM. */
.light-frame{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.light-frame:before{content:"";position:absolute;inset:9px;border:2px solid #274d32;border-radius:12px;opacity:.85}
.bulb{position:absolute;display:block;width:12px;height:20px;border-radius:48% 48% 52% 52%;background:var(--bulb);box-shadow:0 0 8px 2px var(--bulb),0 0 19px 4px var(--bulb);transform:translate(-50%,-50%) rotate(var(--rotation));animation:twinkle 1.5s ease-in-out infinite alternate;animation-delay:var(--delay)}
.bulb:before{content:"";position:absolute;top:-5px;left:3px;width:6px;height:7px;border-radius:2px;background:#a5a68b}
@keyframes twinkle{0%,18%{opacity:.26;filter:brightness(.55);box-shadow:0 0 3px var(--bulb)}48%,100%{opacity:1;filter:brightness(1.3);box-shadow:0 0 9px 3px var(--bulb),0 0 22px 5px var(--bulb)}}
@media(max-width:620px){
 .app{width:calc(100% - 44px);padding:25px 0 34px}
 .hero{min-height:230px;padding:27px 20px;border-radius:10px}
 .hero h1{font-size:clamp(74px,19vw,118px)}
 .heroKicker{font-size:9px;letter-spacing:.09em}
 .heroSub{font-size:15px}
 .heroRule{margin-top:22px}
 .console,.result{margin-top:11px;border-radius:10px}
 .consoleHead{padding:11px 12px}
 .consoleTitle{font-size:10px;letter-spacing:.08em}
 .channels{padding:0 12px}
 .channel{grid-template-columns:67px 1fr 30px;gap:10px;padding:15px 0}
 .channelName{font-size:11px}
 .value{font-size:20px}
 .resultTop{grid-template-columns:92px 1fr;min-height:110px}
 .score{padding:8px}
 .code{font-size:34px}
 .classification{padding:12px}
 .resultName{font-size:17px}
 .resultEmoji{font-size:19px}
 .resultDesc{padding:13px 14px;font-size:13px}
 .actions{padding:10px}
 .shareButton{font-size:10px;min-height:42px;padding:0 10px}
 .bulb{width:9px;height:15px}
}
@media(prefers-reduced-motion:reduce){.bulb{animation:none;opacity:.85;filter:none}}

.app{padding-top:29px}

.hero:before,.hero:after{display:none}

.heroRule{margin:21px auto 0}
.holidayPanel{position:relative;border:1px solid rgba(243,219,174,.52);border-radius:18px;background:linear-gradient(150deg,rgba(17,67,49,.98),rgba(7,38,30,.98));box-shadow:0 18px 45px rgba(0,0,0,.32);padding:7px 0 0;isolation:isolate}
.console,.result{margin:0;border:0;border-radius:0;box-shadow:none;background:none;overflow:visible}
.consoleHead{background:none;border-bottom:1px solid rgba(255,255,255,.09);padding:17px 21px 13px}
.channels{padding:0 21px}
.channel{padding:17px 0}
.result{border-top:1px solid rgba(255,235,192,.2)}
.resultTop{min-height:116px}
.score{background:rgba(199,46,58,.10);border-right:1px solid rgba(255,255,255,.08)}
.resultDesc{margin:0 21px;padding:15px 0;border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09)}
.actions{border:0;padding:13px 20px 18px}
.shareButton{position:relative;isolation:isolate;overflow:visible;border-radius:9px;border-color:#edcfaa;background:#bd3340;box-shadow:0 4px 0 #76212a;transition:background .15s ease}
.shareButton:hover{background:#d8404c}

.app{padding-top:21px}

.channel{padding:15px 0}
.resultTop{min-height:105px}
.resultDesc{margin:0 13px;padding:13px 0}
.actions{padding:13px 12px 17px}

  soundPools.flat().forEach(audio=>audio.load());
}
function playSliderSound(value){
  const now=performance.now();
  if(value===lastSoundValue && now-lastSoundAt<24)return;
  lastSoundValue=value;
  lastSoundAt=now;
  const pool=soundPools[value];
  if(!pool)return;
  const cursor=soundPoolCursor[value];
  const audio=pool[cursor];
  soundPoolCursor[value]=(cursor+1)%SOUND_POOL_SIZE;
  try{
    audio.currentTime=0;
    const playback=audio.play();
    if(playback && playback.catch)playback.catch(()=>{});
  }catch(e){}
}
["touchstart","pointerdown","mousedown","keydown"].forEach(evt=>{
  document.addEventListener(evt,primeNativeAudio,{once:true,passive:evt!=="keydown"});
});
inputs.forEach((input,i)=>{
  input.addEventListener("input",()=>{
    values[i]=parseInt(input.value,10);
    render();
    playSliderSound(values[i]);
  });
});
const shareButton=document.getElementById("shareButton");
const shareStatus=document.getElementById("shareStatus");
shareButton.addEventListener("click",async()=>{
  const key=values.join(""),r=resultLibrary[key],text=`${key} — ${r.name} ${r.emoji}`;
  try{
    if(navigator.share){await navigator.share({text});shareStatus.textContent="SCORE TRANSMITTED";}
    else if(navigator.clipboard && window.isSecureContext){await navigator.clipboard.writeText(text);shareStatus.textContent="SCORE COPIED";}
    else{shareStatus.textContent=text;}
  }catch(err){if(err && err.name!=="AbortError")shareStatus.textContent="TRANSMISSION FAILED";}
});
render();

// Draw bulbs along all four viewport edges. No images or libraries required.
(function installChristmasLights(){
 const frame=document.getElementById("lightFrame");
 const colors=["#ff4453","#ffdc64","#5eea99","#71c9ff","#f7f4dc"];
 let previous="";
 function draw(){
  const w=window.innerWidth,h=window.innerHeight;
  const countX=Math.max(8,Math.ceil(w/30)),countY=Math.max(8,Math.ceil(h/30));
  const signature=countX+":"+countY;
  if(signature===previous)return;
  previous=signature;
  const spots=[];
  for(let i=0;i<=countX;i++){const x=14+(w-28)*i/countX;spots.push([x,14,0],[x,h-14,180]);}
  for(let i=1;i<countY;i++){const y=14+(h-28)*i/countY;spots.push([14,y,-90],[w-14,y,90]);}
  frame.replaceChildren();
  spots.forEach(([x,y,rot],i)=>{
   const bulb=document.createElement("span");
   bulb.className="bulb";
   bulb.style.left=x+"px";bulb.style.top=y+"px";
   bulb.style.setProperty("--rotation",rot+"deg");
   bulb.style.setProperty("--bulb",colors[i%colors.length]);
   bulb.style.setProperty("--delay",(-((i*7)%13)*.17)+"s");
   frame.appendChild(bulb);
  });
 }
 draw();window.addEventListener("resize",draw,{passive:true});
})();

</script>
